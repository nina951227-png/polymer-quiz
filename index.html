<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>塑膠材料應用工程師 初級刷題</title>
<style>
:root{--bg:#f6f7f9;--card:#fff;--tx:#1d2330;--mut:#667085;--bd:#d9dde5;--ac:#2f6fed;--ok:#1a8f4c;--no:#d23b3b}
@media(prefers-color-scheme:dark){:root{--bg:#14171d;--card:#1e232c;--tx:#e8ebf0;--mut:#9aa3b2;--bd:#323946;--ac:#6b9bff;--ok:#4cc084;--no:#ff7a7a}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.6 system-ui,"Noto Sans TC","PingFang TC",sans-serif}
main{max-width:640px;margin:0 auto;padding:16px}
h1{font-size:1.2rem;margin:8px 0}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:16px;margin:12px 0}
.bar{height:6px;background:var(--bd);border-radius:3px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--ac);width:0}
.meta{display:flex;justify-content:space-between;color:var(--mut);font-size:.9rem;margin:6px 0}
.opt{display:block;width:100%;text-align:left;background:var(--card);color:var(--tx);border:1px solid var(--bd);border-radius:10px;padding:10px 12px;margin:8px 0;font:inherit;cursor:pointer}
.opt:hover:not(:disabled){border-color:var(--ac)}
.opt.ok{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 15%,transparent)}
.opt.no{border-color:var(--no);background:color-mix(in srgb,var(--no) 15%,transparent)}
button.btn{background:var(--ac);color:#fff;border:0;border-radius:10px;padding:10px 16px;font:inherit;cursor:pointer;margin:4px 6px 4px 0}
button.btn.alt{background:transparent;color:var(--ac);border:1px solid var(--ac)}
label{margin-right:12px;font-size:.95rem}
</style>
</head>
<body>
<main>
<h1>塑膠材料應用工程師・初級 刷題</h1>
<div id="app"></div>
</main>
<script src="questions.js"></script>
<script>
const app=document.getElementById('app');
let pool,i,score,wrong,done;
function shuffle(a){a=a.slice();for(let k=a.length-1;k>0;k--){const j=Math.floor(Math.random()*(k+1));[a[k],a[j]]=[a[j],a[k]]}return a}
function home(){
  app.innerHTML=`<div class="card"><p>共 ${Q.length} 題。選完答案會立刻顯示對錯。</p>
  <label><input type="checkbox" id="sh" checked> 隨機順序</label>
  <div style="margin-top:12px"><button class="btn" id="go">開始</button></div></div>`;
  document.getElementById('go').onclick=()=>start(Q,document.getElementById('sh').checked);
}
function start(list,sh){pool=sh?shuffle(list):list.slice();i=0;score=0;wrong=[];show()}
function show(){
  if(i>=pool.length)return end();
  const q=pool[i];done=false;
  app.innerHTML=`<div class="meta"><span>第 ${i+1} / ${pool.length} 題</span><span>答對 ${score}</span></div>
  <div class="bar"><i style="width:${i/pool.length*100}%"></i></div>
  <div class="card"><p><b>${q[0]}</b></p><div id="o"></div><div id="nx"></div></div>`;
  const o=document.getElementById('o');
  q[1].forEach((t,k)=>{const b=document.createElement('button');b.className='opt';b.textContent=`(${k+1}) ${t}`;b.onclick=()=>pick(k,b);o.appendChild(b)});
}
function pick(k,b){
  if(done)return;done=true;
  const q=pool[i],bs=[...document.querySelectorAll('.opt')];
  bs.forEach(x=>x.disabled=true);
  bs[q[2]].classList.add('ok');
  if(k===q[2])score++;else{b.classList.add('no');wrong.push(q)}
  const n=document.getElementById('nx');
  n.innerHTML=`<p style="color:var(${k===q[2]?'--ok':'--no'})">${k===q[2]?'答對了！':'答錯了，正確答案是 ('+(q[2]+1)+')'}</p><button class="btn" id="n">${i+1<pool.length?'下一題':'看結果'}</button>`;
  document.getElementById('n').onclick=()=>{i++;show()};
}
function end(){
  app.innerHTML=`<div class="card"><h2>完成！</h2><p>${score} / ${pool.length}（${Math.round(score/pool.length*100)}%）</p>
  ${wrong.length?'<button class="btn" id="rw">重做錯題（'+wrong.length+'）</button>':''}
  <button class="btn alt" id="hm">回首頁</button></div>`;
  if(wrong.length)document.getElementById('rw').onclick=()=>start(wrong,true);
  document.getElementById('hm').onclick=home;
}
home();
</script>
</body>
</html>
